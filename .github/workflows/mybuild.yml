name: Build Localsend for Alpine Linux amd64

on:
  push:
    branches: [ main , build ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # 我们使用Ubuntu来启动，但会切换到Alpine

    container:
      image: alpine:3.21.1 # 使用最新的Alpine版本

    steps:
    # 检查代码到工作区
    - uses: actions/checkout@v4

    # 安装必要的工具和依赖
    - name: Install dependencies
      run: |
        apk update
        apk add --no-cache git bash curl unzip clang lld pkgconfig gcc g++ make ninja
        #apk add --no-cache --repository http://dl-cdn.alpinelinux.org/alpine/edge/testing libstdc++
        apk add --no-cache --repository http://dl-cdn.alpinelinux.org/alpine/edge/testing flutter

    # 验证Flutter安装
    - name: Verify Flutter Installation
      run: flutter --version

    # 安装项目依赖
    - name: Install Flutter dependencies
      working-directory: app
      run: flutter pub get

    # 编译Localsend
    - name: Build Localsend for Alpine Linux
      working-directory: app
      run: |
        # 确保我们使用的是正确的编译器
        #export CC=/usr/bin/clang
        #export CXX=/usr/bin/clang++
        # 构建
        flutter pub run build_runner build -d

    # 如果需要，上传构建产物到工件
    - name: Upload binary
      uses: actions/upload-artifact@v3
      with:
        name: localsend-linux-amd64
        path: ./app/lib/*
